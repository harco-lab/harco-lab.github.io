<!-- third party scripts -->
<script src="https://unpkg.com/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mark.js/8.11.1/mark.min.js" integrity="sha384-t9DGTa+HJ3fETmsPZ37+56VRxK0NsOgFTQ1B4fxaxA+BM48rM5oXrg0/ncF/B3VX" crossorigin="anonymous" defer></script>

<!-- site-wide javascript scripts -->
{% assign site_scripts = "
  js/true-hide.js,
  js/mobile-menu.js,
  js/anchors.js,
  js/search.js,
  js/tooltips.js
" | split: "," %}
{% for script in site_scripts %}
  {% assign path = script | strip %}
  <script src="{{ path | relative_url }}" defer></script>
{% endfor %}
