name: Update Publications

on:
  schedule:
    - cron: "17 20 * * 0" # Mondays at 05:17 KST
  workflow_dispatch:
    inputs:
      source:
        description: "Publication source for the manual GitHub-hosted run"
        required: true
        type: choice
        default: openalex
        options:
          - openalex
          - scholar

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-publications:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Scheduled runs have no inputs and use OpenAlex.
      SOURCE: ${{ inputs.source || 'openalex' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install publication pipeline dependencies
        run: python -m pip install requests pyyaml manubot

      - name: Keep the current publication list for the summary
        run: cp publication/publications.json "$RUNNER_TEMP/publications.before.json"

      - name: Run publication pipeline
        run: python scripts/update_publications.py --source "$SOURCE"

      - name: Drop cache-only changes
        run: |
          if git diff --quiet -- publication/publications.json; then
            git checkout -- _data/publication_metadata_cache.json
          fi

      - name: Summarize the changes
        run: |
          python scripts/publication_changes.py \
            "$RUNNER_TEMP/publications.before.json" publication/publications.json "$SOURCE" \
            > "$RUNNER_TEMP/publication-changes.md"
          cat "$RUNNER_TEMP/publication-changes.md" >> "$GITHUB_STEP_SUMMARY"

      # The source can return papers by other people with the same name, so
      # changes go to a pull request for review instead of straight to main.
      - name: Open a pull request with the changes
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-publications
          delete-branch: true
          add-paths: |
            publication/publications.json
            _data/publication_metadata_cache.json
          commit-message: Update publication data from the pipeline
          title: Update publication data
          body-path: ${{ runner.temp }}/publication-changes.md
